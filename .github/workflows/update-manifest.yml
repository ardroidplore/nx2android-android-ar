name: update-manifest
# Run once by hand (Actions -> update-manifest -> Run workflow) after editing anything in
# app/src/main/assets/nx2a/payload/: it rewrites payload.json (hashes, version +2) and commits it.
permissions:
  contents: write
on:
  workflow_dispatch: {}
jobs:
  manifest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite payload.json
        run: python3 tools/make_manifest.py --bump
      - name: Commit it
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/nx2a/payload/payload.json
          if git diff --cached --quiet; then echo "nothing to commit"; exit 0; fi
          git commit -m "chore: update payload manifest"
          git push
